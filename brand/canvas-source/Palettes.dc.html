<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ovelto Labs — Overlap palettes</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@300;600&amp;family=JetBrains+Mono:wght@500&amp;display=swap">
<style>
body{margin:0}
a{color:#2B4EFF}a:hover{color:#0E1A4F}
</style>
</helmet>
<div style="width: 1840px; height: 760px; box-sizing: border-box; padding: 24px; background: #EEF1F4; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 16px; font-family: 'Sora', sans-serif">
  <sc-for list="{{palettes}}" as="p" hint-placeholder-count="5">
    <div style="display: flex; flex-direction: column; gap: 12px">
      <div style="height: 300px; border-radius: 16px; background: {{p.bg}}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px">
        <svg width="120" height="120" viewBox="0 0 120 120" aria-hidden="true">
          <path d="M60 30 A34 34 0 0 1 60 90 A34 34 0 0 1 60 30 Z" fill="{{p.lens}}"></path>
          <circle cx="44" cy="60" r="34" fill="none" stroke="{{p.ringA}}" stroke-width="8"></circle>
          <circle cx="76" cy="60" r="34" fill="none" stroke="{{p.ringB}}" stroke-width="8"></circle>
        </svg>
        <div style="display: flex; align-items: baseline; gap: 8px; font-size: 34px; letter-spacing: -0.03em; line-height: 1">
          <span style="font-weight: 600; color: {{p.ink}}">Ovelto</span>
          <span style="font-weight: 300; color: {{p.muted}}">Labs</span>
        </div>
      </div>
      <div style="height: 220px; border-radius: 16px; background: {{p.dark}}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px">
        <svg width="84" height="84" viewBox="0 0 120 120" aria-hidden="true">
          <path d="M60 30 A34 34 0 0 1 60 90 A34 34 0 0 1 60 30 Z" fill="{{p.lens}}"></path>
          <circle cx="44" cy="60" r="34" fill="none" stroke="{{p.darkRingA}}" stroke-width="8"></circle>
          <circle cx="76" cy="60" r="34" fill="none" stroke="{{p.darkRingB}}" stroke-width="8"></circle>
        </svg>
        <div style="display: flex; align-items: baseline; gap: 6px; font-size: 24px; letter-spacing: -0.03em; line-height: 1">
          <span style="font-weight: 600; color: {{p.bg}}">Ovelto</span>
          <span style="font-weight: 300; color: {{p.darkMuted}}">Labs</span>
        </div>
      </div>
      <div style="font-size: 16px; font-weight: 600; color: #1B2540">{{p.name}}</div>
      <div style="display: flex; gap: 8px">
        <sc-for list="{{p.swatches}}" as="s" hint-placeholder-count="4">
          <div style="flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 6px">
            <div style="height: 48px; border-radius: 10px; background: {{s.hex}}; box-shadow: inset 0 0 0 1px rgba(27,37,64,0.12)"></div>
            <div style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #3F4966">{{s.hex}}</div>
          </div>
        </sc-for>
      </div>
    </div>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1840,"height":760}}'>
class Component extends DCLogic {
  renderVals() {
    // Each palette: light lockup colours, dark-ground colours (deep tone, never black), and swatches to show.
    const palettes = [
      { name: 'Cobalt + Mint', bg: '#F3F6FF', ink: '#0E1A4F', muted: '#56628F', ringA: '#2B4EFF', ringB: '#2B4EFF', lens: '#34D399',
        dark: '#0E1A4F', darkRingA: '#8FA4FF', darkRingB: '#8FA4FF', darkMuted: '#A9B4DC' },
      { name: 'Forest + Lime', bg: '#F2F5EC', ink: '#12382C', muted: '#547266', ringA: '#1E5B47', ringB: '#1E5B47', lens: '#C8F25C',
        dark: '#12382C', darkRingA: '#E6EFD9', darkRingB: '#E6EFD9', darkMuted: '#A6BFB3' },
      { name: 'Blue meets Green (two-tone)', bg: '#F4F8F7', ink: '#0F2350', muted: '#55658A', ringA: '#2F6BFF', ringB: '#13A874', lens: '#22B8C4',
        dark: '#0F2350', darkRingA: '#7FA3FF', darkRingB: '#5EDDAA', darkMuted: '#A7B3D1' },
      { name: 'Ocean + Coral', bg: '#F4F8FB', ink: '#0A3550', muted: '#4F6E84', ringA: '#0B5C8A', ringB: '#0B5C8A', lens: '#FF7A59',
        dark: '#0A3550', darkRingA: '#9CCBE6', darkRingB: '#9CCBE6', darkMuted: '#A3BDCD' },
      { name: 'Teal + Sun', bg: '#FBF8F0', ink: '#0B3B37', muted: '#5B716D', ringA: '#0F766E', ringB: '#0F766E', lens: '#FFC23D',
        dark: '#0B3B37', darkRingA: '#A7E0D8', darkRingB: '#A7E0D8', darkMuted: '#A5C2BD' }
    ];
    return {
      palettes: palettes.map((p) => ({
        ...p,
        // Show only distinct colours as swatches.
        swatches: [...new Set([p.ringA, p.ringB, p.lens, p.dark, p.bg])].map((hex) => ({ hex }))
      }))
    };
  }
}
</script>
</body>
</html>
