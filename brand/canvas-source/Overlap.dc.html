<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ovelto Labs — Overlap</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@300;600&amp;display=swap">
<style>
body{margin:0}
a{color:#111114}a:hover{color:#444}
</style>
</helmet>
<div style="width: 880px; height: 560px; box-sizing: border-box; padding: 16px; background: #E9E6DF; display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 16px; font-family: 'Sora', sans-serif; color: #111114">
  <div style="background: #F6F4EF; border-radius: 16px; display: flex; align-items: center; justify-content: center; gap: 18px">
    <svg width="104" height="104" viewBox="0 0 120 120" aria-hidden="true">
      <path d="M60 30 A34 34 0 0 1 60 90 A34 34 0 0 1 60 30 Z" fill="{{accent}}"></path>
      <circle cx="44" cy="60" r="34" fill="none" stroke="#111114" stroke-width="8"></circle>
      <circle cx="76" cy="60" r="34" fill="none" stroke="#111114" stroke-width="8"></circle>
    </svg>
    <div style="display: flex; align-items: baseline; gap: 12px; font-size: 52px; letter-spacing: -0.03em; line-height: 1">
      <span style="font-weight: 600">Ovelto</span>
      <span style="font-weight: 300; color: #6B6862">Labs</span>
    </div>
  </div>
  <div style="display: grid; grid-template-rows: minmax(0, 1.3fr) minmax(0, 1fr); gap: 16px">
    <div style="background: #111114; border-radius: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px">
      <svg width="84" height="84" viewBox="0 0 120 120" aria-hidden="true">
        <path d="M60 30 A34 34 0 0 1 60 90 A34 34 0 0 1 60 30 Z" fill="{{accent}}"></path>
        <circle cx="44" cy="60" r="34" fill="none" stroke="#F6F4EF" stroke-width="8"></circle>
        <circle cx="76" cy="60" r="34" fill="none" stroke="#F6F4EF" stroke-width="8"></circle>
      </svg>
      <div style="display: flex; align-items: baseline; gap: 8px; font-size: 30px; letter-spacing: -0.03em; line-height: 1; color: #F6F4EF">
        <span style="font-weight: 600">Ovelto</span>
        <span style="font-weight: 300; color: #A5A29B">Labs</span>
      </div>
    </div>
    <div style="display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px">
      <div style="background: #F6F4EF; border-radius: 16px; display: flex; align-items: center; justify-content: center">
        <svg width="96" height="96" viewBox="0 0 120 120" role="img" aria-label="Ovelto Labs app icon">
          <rect width="120" height="120" rx="28" fill="#111114"></rect>
          <g transform="translate(60 60) scale(0.72) translate(-60 -60)">
            <path d="M60 30 A34 34 0 0 1 60 90 A34 34 0 0 1 60 30 Z" fill="{{accent}}"></path>
            <circle cx="44" cy="60" r="34" fill="none" stroke="#F6F4EF" stroke-width="9"></circle>
            <circle cx="76" cy="60" r="34" fill="none" stroke="#F6F4EF" stroke-width="9"></circle>
          </g>
        </svg>
      </div>
      <div style="background: #F6F4EF; border-radius: 16px; display: flex; align-items: center; justify-content: center; gap: 16px">
        <svg width="32" height="32" viewBox="0 0 120 120" aria-hidden="true"><path d="M60 30 A34 34 0 0 1 60 90 A34 34 0 0 1 60 30 Z" fill="{{accent}}"></path><circle cx="44" cy="60" r="34" fill="none" stroke="#111114" stroke-width="11"></circle><circle cx="76" cy="60" r="34" fill="none" stroke="#111114" stroke-width="11"></circle></svg>
        <svg width="20" height="20" viewBox="0 0 120 120" aria-hidden="true"><path d="M60 30 A34 34 0 0 1 60 90 A34 34 0 0 1 60 30 Z" fill="{{accent}}"></path><circle cx="44" cy="60" r="34" fill="none" stroke="#111114" stroke-width="13"></circle><circle cx="76" cy="60" r="34" fill="none" stroke="#111114" stroke-width="13"></circle></svg>
        <svg width="16" height="16" viewBox="0 0 120 120" aria-hidden="true"><path d="M60 30 A34 34 0 0 1 60 90 A34 34 0 0 1 60 30 Z" fill="{{accent}}"></path><circle cx="44" cy="60" r="34" fill="none" stroke="#111114" stroke-width="14"></circle><circle cx="76" cy="60" r="34" fill="none" stroke="#111114" stroke-width="14"></circle></svg>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#FF5B2E","options":["#FF5B2E","#C6F432","#2F5BFF","#111114"]},"$preview":{"width":880,"height":560}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#FF5B2E' };
  }
}
</script>
</body>
</html>
