<!doctype html>
<html lang="en">
<head>

<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600&amp;display=swap">
<style>
body{margin:0}
a{color:#1A2B6D}a:hover{color:#0B1640}

/* Shared 5s loop. fill-mode both keeps the first frame during delays. */
.ov-anim{animation-duration:5s;animation-iteration-count:infinite;animation-timing-function:cubic-bezier(.22,1,.36,1);animation-fill-mode:both}
.ov-6s{animation-duration:6s}
.ov-tb{transform-box:fill-box;transform-origin:center}
.ov-vb{transform-box:view-box;transform-origin:60px 60px}

/* Wordmark rise used by several tiles */
.k-word{animation-name:kWord}
@keyframes kWord{0%,50%{transform:translateY(10px);opacity:0}64%,88%{transform:translateY(0);opacity:1}100%{transform:translateY(0);opacity:0}}

/* 1. Swing & settle: the mark arrives level, swings past its 20° tilt and settles — the tilt becomes a gesture. */
.f1-swing{animation-name:f1Swing}
@keyframes f1Swing{0%{transform:rotate(20deg);opacity:0}12%{opacity:1}40%{transform:rotate(-7deg)}52%,88%{transform:rotate(0deg);opacity:1}100%{transform:rotate(0deg);opacity:0}}

/* 2. Draw & link: each ring is traced (the weave gap is already built in), then the overlap fills. */
.f2-a{animation-name:f2A}
.f2-b{animation-name:f2B}
.f2-lens{animation-name:f2Lens}
@keyframes f2A{0%{stroke-dashoffset:214px;opacity:1}35%,88%{stroke-dashoffset:0px;opacity:1}100%{stroke-dashoffset:0px;opacity:0}}
@keyframes f2B{0%,12%{stroke-dashoffset:-214px;opacity:1}47%,88%{stroke-dashoffset:0px;opacity:1}100%{stroke-dashoffset:0px;opacity:0}}
@keyframes f2Lens{0%,47%{transform:scale(0);opacity:0}58%{transform:scale(1.15);opacity:1}66%,88%{transform:scale(1);opacity:1}100%{transform:scale(1);opacity:0}}

/* 3. Weave snap: the rings start flat on top of each other, then the gaps open and they lock together. */
.f3-cut{animation-name:f3Cut}
.f3-bump{animation-name:f3Bump}
@keyframes f3Cut{0%,38%{stroke-width:0px}45%{stroke-width:19px}52%,90%{stroke-width:14px}100%{stroke-width:0px}}
@keyframes f3Bump{0%,38%{transform:scale(1)}45%{transform:scale(1.05)}52%,100%{transform:scale(1)}}

/* 4. Type-on: “ovelto.labs” is typed like code, with a blinking cursor. */
.ov-type{animation-name:ovType;animation-timing-function:steps(1,end)}
@keyframes ovType{0%{opacity:0}2%,78%{opacity:1}82%,100%{opacity:0}}
.ov-cursor{animation:ovBlink 1s steps(1,end) infinite}
@keyframes ovBlink{0%{opacity:1}50%{opacity:0}}

/* 5. Thinking loader: the linked pair turns steadily while the overlap breathes. */
.f5-spin{animation:f5Spin 2.4s linear infinite}
.f5-breathe{animation:f5Breathe 1.2s ease-in-out infinite alternate}
@keyframes f5Spin{to{transform:rotate(360deg)}}
@keyframes f5Breathe{from{transform:scale(1);opacity:1}to{transform:scale(0.78);opacity:0.6}}

/* 6. Lens scan: a band of light sweeps through the overlap — “insight” passing through. */
.f6-scan{animation:f6Scan 3.2s cubic-bezier(.45,0,.2,1) infinite}
@keyframes f6Scan{0%,25%{transform:translateX(0px)}70%,100%{transform:translateX(64px)}}

/* 7. Hover half-turn (nav logo): the pair rotates 180° and the overlap brightens. */
.f7-mark{transition:transform .9s cubic-bezier(.22,1,.36,1)}
.f7-lens{transition:fill .5s ease}
.f7-tile:hover .f7-mark{transform:rotate(180deg)}
.f7-tile:hover .f7-lens{fill:#34D399}

/* 8. Full intro: draw both rings level → weave snaps → swing into the tilt → name arrives. */
.f8-a{animation-name:f8A}
.f8-b{animation-name:f8B}
.f8-cut{animation-name:f8Cut}
.f8-lens{animation-name:f8Lens}
.f8-swing{animation-name:f8Swing}
.f8-word{animation-name:f8Word}
@keyframes f8A{0%{stroke-dashoffset:214px;opacity:1}26%,90%{stroke-dashoffset:0px;opacity:1}100%{stroke-dashoffset:0px;opacity:0}}
@keyframes f8B{0%,8%{stroke-dashoffset:-214px;opacity:1}34%,90%{stroke-dashoffset:0px;opacity:1}100%{stroke-dashoffset:0px;opacity:0}}
@keyframes f8Cut{0%,38%{stroke-width:0px}43%{stroke-width:19px}48%,100%{stroke-width:14px}}
@keyframes f8Lens{0%,40%{transform:scale(0);opacity:0}50%{transform:scale(1.15);opacity:1}56%,90%{transform:scale(1);opacity:1}100%{transform:scale(1);opacity:0}}
@keyframes f8Swing{0%,46%{transform:rotate(20deg)}56%{transform:rotate(-7deg)}64%,100%{transform:rotate(0deg)}}
@keyframes f8Word{0%,64%{transform:translateY(10px);opacity:0}74%,90%{transform:translateY(0);opacity:1}100%{transform:translateY(0);opacity:0}}

/* Motion switched off: everything shows the finished logo. */
@media (prefers-reduced-motion: reduce){.ov-anim,.ov-cursor,.f5-spin,.f5-breathe,.f6-scan{animation:none !important}.f7-mark,.f7-lens{transition:none}}
</style>
</helmet>
<div style="width: 1840px; height: 1060px; box-sizing: border-box; padding: 24px; background: #EDF0F4; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); grid-template-rows: repeat(2, minmax(0, 1fr)); gap: 16px; font-family: 'Space Grotesk', sans-serif">

  <!-- 1. Swing & settle -->

        <clipPath id="p1-ct"><circle cx="60" cy="30" r="13"></circle></clipPath>
        <clipPath id="p1-cb"><circle cx="60" cy="90" r="13"></circle></clipPath>
        <mask id="p1-ma" maskUnits="userSpaceOnUse" x="-40" y="-40" width="200" height="200"><rect x="-40" y="-40" width="200" height="200" fill="#ffffff"></rect><circle cx="76" cy="60" r="34" fill="none" stroke="#000000" stroke-width="14" clip-path="url(#p1-ct)"></circle></mask>
        <mask id="p1-mb" maskUnits="userSpaceOnUse" x="-40" y="-40" width="200" height="200"><rect x="-40" y="-40" width="200" height="200" fill="#ffffff"></rect><circle cx="44" cy="60" r="34" fill="none" stroke="#000000" stroke-width="14" clip-path="url(#p1-cb)"></circle></mask>
      </defs>
      <g class="ov-anim ov-vb f1-swing">
        <g transform="rotate(-20 60 60)">

    <div class="ov-anim k-word" style="display: flex; align-items: baseline; font-size: 36px; letter-spacing: -0.035em; line-height: 1"><span style="font-weight: 600; color: #0B1640">ovelto</span><span style="font-weight: 400; color: #0E9F6E">.labs</span></div>
    <div style="font-size: 15px; font-weight: 600; color: #1B2540">1 · Swing &amp; settle</div>
  </div>

  <div style="background: #F3F6FA; border-radius: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px">

        <mask id="p2-mb" maskUnits="userSpaceOnUse" x="-40" y="-40" width="200" height="200"><rect x="-40" y="-40" width="200" height="200" fill="#ffffff"></rect><circle cx="44" cy="60" r="34" fill="none" stroke="#000000" stroke-width="14" clip-path="url(#p2-cb)"></circle></mask>
      </defs>
      <g transform="rotate(-20 60 60)">
        <path class="ov-anim ov-tb f2-lens" d="M60 30 A34 34 0 0 1 60 90 A34 34 0 0 1 60 30 Z" fill="#6EE7B7"></path>
        <circle class="ov-anim f2-a" cx="44" cy="60" r="34" fill="none" stroke="#1A2B6D" stroke-width="8" stroke-dasharray="214" mask="url(#p2-ma)"></circle>
        <circle class="ov-anim f2-b" cx="76" cy="60" r="34" fill="none" stroke="#0E9F6E" stroke-width="8" stroke-dasharray="214" mask="url(#p2-mb)"></circle>

    </svg>
    <div class="ov-anim k-word" style="display: flex; align-items: baseline; font-size: 36px; letter-spacing: -0.035em; line-height: 1"><span style="font-weight: 600; color: #0B1640">ovelto</span><span style="font-weight: 400; color: #0E9F6E">.labs</span></div>
    <div style="font-size: 15px; font-weight: 600; color: #1B2540">2 · Draw &amp; link</div>
  </div>

  <!-- 3. Weave snap -->

    <svg width="200" height="200" viewBox="0 0 120 120" aria-hidden="true" style="overflow: visible">

        <clipPath id="p3-cb"><circle cx="60" cy="90" r="13"></circle></clipPath>

        <mask id="p3-mb" maskUnits="userSpaceOnUse" x="-40" y="-40" width="200" height="200"><rect x="-40" y="-40" width="200" height="200" fill="#ffffff"></rect><circle class="ov-anim f3-cut" cx="44" cy="60" r="34" fill="none" stroke="#000000" stroke-width="14" clip-path="url(#p3-cb)"></circle></mask>
      </defs>
      <g class="ov-anim ov-vb f3-bump">
        <g transform="rotate(-20 60 60)">
          <path d="M60 30 A34 34 0 0 1 60 90 A34 34 0 0 1 60 30 Z" fill="#6EE7B7"></path>
          <circle cx="44" cy="60" r="34" fill="none" stroke="#1A2B6D" stroke-width="8" mask="url(#p3-ma)"></circle>
          <circle cx="76" cy="60" r="34" fill="none" stroke="#0E9F6E" stroke-width="8" mask="url(#p3-mb)"></circle>
        </g>
      </g>
    </svg>
    <div style="display: flex; align-items: baseline; font-size: 36px; letter-spacing: -0.035em; line-height: 1"><span style="font-weight: 600; color: #0B1640">ovelto</span><span style="font-weight: 400; color: #0E9F6E">.labs</span></div>
    <div style="font-size: 15px; font-weight: 600; color: #1B2540">3 · Weave snap</div>

  <!-- 4. Type-on (deep navy) -->

        <mask id="p4-mb" maskUnits="userSpaceOnUse" x="-40" y="-40" width="200" height="200"><rect x="-40" y="-40" width="200" height="200" fill="#ffffff"></rect><circle cx="44" cy="60" r="34" fill="none" stroke="#000000" stroke-width="14" clip-path="url(#p4-cb)"></circle></mask>
      </defs>
      <g transform="rotate(-20 60 60)">
        <path d="M60 30 A34 34 0 0 1 60 90 A34 34 0 0 1 60 30 Z" fill="#6EE7B7"></path>
        <circle cx="44" cy="60" r="34" fill="none" stroke="#9DB0F5" stroke-width="8" mask="url(#p4-ma)"></circle>
        <circle cx="76" cy="60" r="34" fill="none" stroke="#34D399" stroke-width="8" mask="url(#p4-mb)"></circle>
      </g>
    </svg>
    <div style="display: flex; align-items: baseline; font-size: 36px; letter-spacing: -0.035em; line-height: 1; font-weight: 600; color: #F3F6FA">
      <span class="ov-anim ov-type" style="animation-delay: 0.10s">o</span><span class="ov-anim ov-type" style="animation-delay: 0.20s">v</span><span class="ov-anim ov-type" style="animation-delay: 0.30s">e</span><span class="ov-anim ov-type" style="animation-delay: 0.40s">l</span><span class="ov-anim ov-type" style="animation-delay: 0.50s">t</span><span class="ov-anim ov-type" style="animation-delay: 0.60s">o</span><span class="ov-anim ov-type" style="animation-delay: 0.85s; font-weight: 400; color: #34D399">.</span><span class="ov-anim ov-type" style="animation-delay: 0.95s; font-weight: 400; color: #34D399">l</span><span class="ov-anim ov-type" style="animation-delay: 1.05s; font-weight: 400; color: #34D399">a</span><span class="ov-anim ov-type" style="animation-delay: 1.15s; font-weight: 400; color: #34D399">b</span><span class="ov-anim ov-type" style="animation-delay: 1.25s; font-weight: 400; color: #34D399">s</span><span class="ov-cursor" style="display: inline-block; width: 3px; height: 30px; margin-left: 4px; background: #34D399; align-self: center"></span>
    </div>
    <div style="font-size: 15px; font-weight: 600; color: #DDE3F5">4 · Type-on “.labs”</div>
  </div>

  <!-- 5. Thinking loader -->
  <div style="background: #F3F6FA; border-radius: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px">
    <svg width="160" height="160" viewBox="0 0 120 120" aria-hidden="true" style="overflow: visible">
      <defs>
        <clipPath id="p5-ct"><circle cx="60" cy="30" r="13"></circle></clipPath>
        <clipPath id="p5-cb"><circle cx="60" cy="90" r="13"></circle></clipPath>
        <mask id="p5-ma" maskUnits="userSpaceOnUse" x="-40" y="-40" width="200" height="200"><rect x="-40" y="-40" width="200" height="200" fill="#ffffff"></rect><circle cx="76" cy="60" r="34" fill="none" stroke="#000000" stroke-width="14" clip-path="url(#p5-ct)"></circle></mask>
        <mask id="p5-mb" maskUnits="userSpaceOnUse" x="-40" y="-40" width="200" height="200"><rect x="-40" y="-40" width="200" height="200" fill="#ffffff"></rect><circle cx="44" cy="60" r="34" fill="none" stroke="#000000" stroke-width="14" clip-path="url(#p5-cb)"></circle></mask>
      </defs>
      <g class="ov-vb f5-spin">
        <g transform="rotate(-20 60 60)">
          <path class="ov-tb f5-breathe" d="M60 30 A34 34 0 0 1 60 90 A34 34 0 0 1 60 30 Z" fill="#6EE7B7"></path>
          <circle cx="44" cy="60" r="34" fill="none" stroke="#1A2B6D" stroke-width="8" mask="url(#p5-ma)"></circle>
          <circle cx="76" cy="60" r="34" fill="none" stroke="#0E9F6E" stroke-width="8" mask="url(#p5-mb)"></circle>
        </g>
      </g>
    </svg>
    <div style="font-size: 20px; color: #56628A; letter-spacing: -0.01em">thinking…</div>
    <div style="font-size: 15px; font-weight: 600; color: #1B2540">5 · Thinking loader</div>
  </div>

  <!-- 6. Lens scan -->
  <div style="background: #F3F6FA; border-radius: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px">
    <svg width="200" height="200" viewBox="0 0 120 120" aria-hidden="true" style="overflow: visible">
      <defs>

        <clipPath id="p6-cb"><circle cx="60" cy="90" r="13"></circle></clipPath>

        <mask id="p6-ma" maskUnits="userSpaceOnUse" x="-40" y="-40" width="200" height="200"><rect x="-40" y="-40" width="200" height="200" fill="#ffffff"></rect><circle cx="76" cy="60" r="34" fill="none" stroke="#000000" stroke-width="14" clip-path="url(#p6-ct)"></circle></mask>

      <g transform="rotate(-20 60 60)">

        <g clip-path="url(#p6-lens)">

        <circle cx="76" cy="60" r="34" fill="none" stroke="#0E9F6E" stroke-width="8" mask="url(#p6-mb)"></circle>

    </svg>
    <div style="display: flex; align-items: baseline; font-size: 36px; letter-spacing: -0.035em; line-height: 1"><span style="font-weight: 600; color: #0B1640">ovelto</span><span style="font-weight: 400; color: #0E9F6E">.labs</span></div>
    <div style="font-size: 15px; font-weight: 600; color: #1B2540">6 · Lens scan</div>
  </div>

  <!-- 7. Hover half-turn -->
  <div class="f7-tile" style="background: #F3F6FA; border-radius: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px">
    <svg width="200" height="200" viewBox="0 0 120 120" aria-hidden="true" style="overflow: visible">
      <defs>
        <clipPath id="p7-ct"><circle cx="60" cy="30" r="13"></circle></clipPath>

          <circle cx="44" cy="60" r="34" fill="none" stroke="#1A2B6D" stroke-width="8" mask="url(#p7-ma)"></circle>
          <circle cx="76" cy="60" r="34" fill="none" stroke="#0E9F6E" stroke-width="8" mask="url(#p7-mb)"></circle>

    <div style="display: flex; align-items: baseline; font-size: 36px; letter-spacing: -0.035em; line-height: 1"><span style="font-weight: 600; color: #0B1640">ovelto</span><span style="font-weight: 400; color: #0E9F6E">.labs</span></div>
    <div style="font-size: 15px; font-weight: 600; color: #1B2540">7 · Hover half-turn (nav) — hover me</div>
  </div>

  <!-- 8. Full intro (deep navy) -->
  <div style="background: #0B1640; border-radius: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px">

        <clipPath id="p8-cb"><circle cx="60" cy="90" r="13"></circle></clipPath>
        <mask id="p8-ma" maskUnits="userSpaceOnUse" x="-40" y="-40" width="200" height="200"><rect x="-40" y="-40" width="200" height="200" fill="#ffffff"></rect><circle class="ov-anim ov-6s f8-cut" cx="76" cy="60" r="34" fill="none" stroke="#000000" stroke-width="14" clip-path="url(#p8-ct)"></circle></mask>
        <mask id="p8-mb" maskUnits="userSpaceOnUse" x="-40" y="-40" width="200" height="200"><rect x="-40" y="-40" width="200" height="200" fill="#ffffff"></rect><circle class="ov-anim ov-6s f8-cut" cx="44" cy="60" r="34" fill="none" stroke="#000000" stroke-width="14" clip-path="url(#p8-cb)"></circle></mask>
      </defs>
      <g class="ov-anim ov-6s ov-vb f8-swing">
        <g transform="rotate(-20 60 60)">
          <path class="ov-anim ov-6s ov-tb f8-lens" d="M60 30 A34 34 0 0 1 60 90 A34 34 0 0 1 60 30 Z" fill="#6EE7B7"></path>
          <circle class="ov-anim ov-6s f8-a" cx="44" cy="60" r="34" fill="none" stroke="#9DB0F5" stroke-width="8" stroke-dasharray="214" mask="url(#p8-ma)"></circle>
          <circle class="ov-anim ov-6s f8-b" cx="76" cy="60" r="34" fill="none" stroke="#34D399" stroke-width="8" stroke-dasharray="214" mask="url(#p8-mb)"></circle>
        </g>
      </g>
    </svg>
    <div class="ov-anim ov-6s f8-word" style="display: flex; align-items: baseline; font-size: 36px; letter-spacing: -0.035em; line-height: 1"><span style="font-weight: 600; color: #F3F6FA">ovelto</span><span style="font-weight: 400; color: #34D399">.labs</span></div>
    <div style="font-size: 15px; font-weight: 600; color: #DDE3F5">8 · Full intro (hero / site load)</div>
  </div>

</div>
