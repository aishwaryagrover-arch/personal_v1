<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ovelto Labs — Site intro and loader</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600&amp;display=swap">
<style>
body{margin:0}
a{color:#1A2B6D}a:hover{color:#0B1640}

/* ===== Combined intro: one 7s loop =====
   0–14%   "ovelto" rises in while the rings start drawing (level)
   0–32%   design ring, then AI ring, are traced
   36–46%  weave snaps (gaps open) and the mint overlap pops
   52–68%  the pair swings into its 20° tilt — the green ring rises
   70–78%  ".labs" is typed on, letter by letter, with a blinking cursor
   94–100% everything fades so the loop can restart (on the site it plays once and holds) */
.iv{animation-duration:7s;animation-iteration-count:infinite;animation-fill-mode:both;animation-timing-function:cubic-bezier(.22,1,.36,1)}
.vb{transform-box:view-box;transform-origin:60px 60px}
.tb{transform-box:fill-box;transform-origin:center}

.i-a{animation-name:iA}
.i-b{animation-name:iB}
.i-cut{animation-name:iCut}
.i-lens{animation-name:iLens}
.i-swing{animation-name:iSwing}
.i-word{animation-name:iWord}
.i-row{animation-name:iRow;animation-timing-function:linear}
@keyframes iA{0%{stroke-dashoffset:214px}24%,100%{stroke-dashoffset:0px}}
@keyframes iB{0%,8%{stroke-dashoffset:-214px}32%,100%{stroke-dashoffset:0px}}
@keyframes iCut{0%,36%{stroke-width:0px}41%{stroke-width:19px}46%,100%{stroke-width:14px}}
@keyframes iLens{0%,38%{transform:scale(0);opacity:0}47%{transform:scale(1.15);opacity:1}53%,100%{transform:scale(1);opacity:1}}
@keyframes iSwing{0%,52%{transform:rotate(20deg)}62%{transform:rotate(-7deg)}68%,100%{transform:rotate(0deg)}}
@keyframes iWord{0%{transform:translateY(12px);opacity:0}14%,100%{transform:translateY(0);opacity:1}}
@keyframes iRow{0%,94%{opacity:1}100%{opacity:0}}

/* Typed letters: each one "opens" its width at its moment, so the cursor follows the text. */
.i-ch{display:inline-block;overflow:hidden;vertical-align:bottom;animation-timing-function:steps(1,end)}
.i-c1{animation-name:iC1}.i-c2{animation-name:iC2}.i-c3{animation-name:iC3}.i-c4{animation-name:iC4}.i-c5{animation-name:iC5}
@keyframes iC1{0%,70%{max-width:0}71%,100%{max-width:1em}}
@keyframes iC2{0%,72%{max-width:0}73%,100%{max-width:1em}}
@keyframes iC3{0%,74%{max-width:0}75%,100%{max-width:1em}}
@keyframes iC4{0%,76%{max-width:0}77%,100%{max-width:1em}}
@keyframes iC5{0%,78%{max-width:0}79%,100%{max-width:1em}}
.i-cur{animation-name:iCur;animation-timing-function:steps(1,end)}
@keyframes iCur{0%,68%{opacity:0}69%,100%{opacity:1}}
.i-blink{animation:iBlink .9s steps(1,end) infinite}
@keyframes iBlink{0%{opacity:1}50%{opacity:0}}

/* ===== Thinking loader (retained) ===== */
.f5-spin{animation:f5Spin 2.4s linear infinite}
.f5-breathe{animation:f5Breathe 1.2s ease-in-out infinite alternate}
@keyframes f5Spin{to{transform:rotate(360deg)}}
@keyframes f5Breathe{from{transform:scale(1);opacity:1}to{transform:scale(0.78);opacity:0.6}}

@media (prefers-reduced-motion: reduce){.iv,.i-blink,.f5-spin,.f5-breathe{animation:none !important}.i-ch{max-width:none}}
</style>
</helmet>
<div style="width: 1840px; height: 1010px; box-sizing: border-box; padding: 24px; background: #EDF0F4; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-rows: 520px minmax(0, 1fr); gap: 16px; font-family: 'Space Grotesk', sans-serif">

  <!-- Hero intro on deep navy (site load) -->
  <div style="grid-column: span 2; background: #0B1640; border-radius: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 40px">
    <!-- fixed-width row, left-aligned, so the mark never shifts while ".labs" types out -->
    <div class="iv i-row" style="width: 590px; display: flex; align-items: center; gap: 22px">
      <svg width="132" height="132" viewBox="0 0 120 120" aria-hidden="true" style="overflow: visible; flex: none">
        <defs>
          <clipPath id="i1-ct"><circle cx="60" cy="30" r="13"></circle></clipPath>
          <clipPath id="i1-cb"><circle cx="60" cy="90" r="13"></circle></clipPath>
          <mask id="i1-ma" maskUnits="userSpaceOnUse" x="-40" y="-40" width="200" height="200"><rect x="-40" y="-40" width="200" height="200" fill="#ffffff"></rect><circle class="iv i-cut" cx="76" cy="60" r="34" fill="none" stroke="#000000" stroke-width="14" clip-path="url(#i1-ct)"></circle></mask>
          <mask id="i1-mb" maskUnits="userSpaceOnUse" x="-40" y="-40" width="200" height="200"><rect x="-40" y="-40" width="200" height="200" fill="#ffffff"></rect><circle class="iv i-cut" cx="44" cy="60" r="34" fill="none" stroke="#000000" stroke-width="14" clip-path="url(#i1-cb)"></circle></mask>
        </defs>
        <g class="iv vb i-swing">
          <g transform="rotate(-20 60 60)">
            <path class="iv tb i-lens" d="M60 30 A34 34 0 0 1 60 90 A34 34 0 0 1 60 30 Z" fill="#6EE7B7"></path>
            <circle class="iv i-a" cx="44" cy="60" r="34" fill="none" stroke="#9DB0F5" stroke-width="8" stroke-dasharray="214" mask="url(#i1-ma)"></circle>
            <circle class="iv i-b" cx="76" cy="60" r="34" fill="none" stroke="#34D399" stroke-width="8" stroke-dasharray="214" mask="url(#i1-mb)"></circle>
          </g>
        </g>
      </svg>
      <div style="display: flex; align-items: center; font-size: 84px; letter-spacing: -0.035em; line-height: 1; white-space: nowrap">
        <span class="iv i-word" style="font-weight: 600; color: #F3F6FA">ovelto</span><span style="font-weight: 400; color: #34D399"><span class="iv i-ch i-c1">.</span><span class="iv i-ch i-c2">l</span><span class="iv i-ch i-c3">a</span><span class="iv i-ch i-c4">b</span><span class="iv i-ch i-c5">s</span></span><span class="iv i-cur" style="display: inline-block; margin-left: 6px"><span class="i-blink" style="display: block; width: 5px; height: 64px; background: #34D399"></span></span>
      </div>
    </div>
    <div style="font-size: 15px; font-weight: 600; color: #DDE3F5">Site intro · draw → snap → swing (green ring rises) → “.labs” types on</div>
  </div>

  <!-- Same intro on the light ground, smaller -->
  <div style="background: #F3F6FA; border-radius: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 30px">
    <div class="iv i-row" style="width: 400px; display: flex; align-items: center; gap: 16px">
      <svg width="88" height="88" viewBox="0 0 120 120" aria-hidden="true" style="overflow: visible; flex: none">
        <defs>
          <clipPath id="i2-ct"><circle cx="60" cy="30" r="13"></circle></clipPath>
          <clipPath id="i2-cb"><circle cx="60" cy="90" r="13"></circle></clipPath>
          <mask id="i2-ma" maskUnits="userSpaceOnUse" x="-40" y="-40" width="200" height="200"><rect x="-40" y="-40" width="200" height="200" fill="#ffffff"></rect><circle class="iv i-cut" cx="76" cy="60" r="34" fill="none" stroke="#000000" stroke-width="14" clip-path="url(#i2-ct)"></circle></mask>
          <mask id="i2-mb" maskUnits="userSpaceOnUse" x="-40" y="-40" width="200" height="200"><rect x="-40" y="-40" width="200" height="200" fill="#ffffff"></rect><circle class="iv i-cut" cx="44" cy="60" r="34" fill="none" stroke="#000000" stroke-width="14" clip-path="url(#i2-cb)"></circle></mask>
        </defs>
        <g class="iv vb i-swing">
          <g transform="rotate(-20 60 60)">
            <path class="iv tb i-lens" d="M60 30 A34 34 0 0 1 60 90 A34 34 0 0 1 60 30 Z" fill="#6EE7B7"></path>
            <circle class="iv i-a" cx="44" cy="60" r="34" fill="none" stroke="#1A2B6D" stroke-width="8" stroke-dasharray="214" mask="url(#i2-ma)"></circle>
            <circle class="iv i-b" cx="76" cy="60" r="34" fill="none" stroke="#0E9F6E" stroke-width="8" stroke-dasharray="214" mask="url(#i2-mb)"></circle>
          </g>
        </g>
      </svg>
      <div style="display: flex; align-items: center; font-size: 56px; letter-spacing: -0.035em; line-height: 1; white-space: nowrap">
        <span class="iv i-word" style="font-weight: 600; color: #0B1640">ovelto</span><span style="font-weight: 400; color: #0E9F6E"><span class="iv i-ch i-c1">.</span><span class="iv i-ch i-c2">l</span><span class="iv i-ch i-c3">a</span><span class="iv i-ch i-c4">b</span><span class="iv i-ch i-c5">s</span></span><span class="iv i-cur" style="display: inline-block; margin-left: 4px"><span class="i-blink" style="display: block; width: 4px; height: 44px; background: #0E9F6E"></span></span>
      </div>
    </div>
    <div style="font-size: 15px; font-weight: 600; color: #1B2540">Site intro · light version</div>
  </div>

  <!-- Thinking loader, retained: large, and in context as UI states -->
  <div style="background: #F3F6FA; border-radius: 16px; display: flex; align-items: center; justify-content: center; gap: 40px; padding: 24px; box-sizing: border-box">
    <svg width="130" height="130" viewBox="0 0 120 120" aria-hidden="true" style="overflow: visible; flex: none">
      <defs>
        <clipPath id="l1-ct"><circle cx="60" cy="30" r="13"></circle></clipPath>
        <clipPath id="l1-cb"><circle cx="60" cy="90" r="13"></circle></clipPath>
        <mask id="l1-ma" maskUnits="userSpaceOnUse" x="-40" y="-40" width="200" height="200"><rect x="-40" y="-40" width="200" height="200" fill="#ffffff"></rect><circle cx="76" cy="60" r="34" fill="none" stroke="#000000" stroke-width="14" clip-path="url(#l1-ct)"></circle></mask>
        <mask id="l1-mb" maskUnits="userSpaceOnUse" x="-40" y="-40" width="200" height="200"><rect x="-40" y="-40" width="200" height="200" fill="#ffffff"></rect><circle cx="44" cy="60" r="34" fill="none" stroke="#000000" stroke-width="14" clip-path="url(#l1-cb)"></circle></mask>
      </defs>
      <g class="vb f5-spin">
        <g transform="rotate(-20 60 60)">
          <path class="tb f5-breathe" d="M60 30 A34 34 0 0 1 60 90 A34 34 0 0 1 60 30 Z" fill="#6EE7B7"></path>
          <circle cx="44" cy="60" r="34" fill="none" stroke="#1A2B6D" stroke-width="8" mask="url(#l1-ma)"></circle>
          <circle cx="76" cy="60" r="34" fill="none" stroke="#0E9F6E" stroke-width="8" mask="url(#l1-mb)"></circle>
        </g>
      </g>
    </svg>
    <div style="display: flex; flex-direction: column; gap: 14px; min-width: 0">
      <!-- Light UI chip -->
      <div style="display: flex; align-items: center; gap: 10px; background: #FFFFFF; border-radius: 999px; padding: 10px 18px 10px 12px; box-shadow: inset 0 0 0 1px #D5DBE7">
        <svg width="24" height="24" viewBox="0 0 120 120" aria-hidden="true" style="overflow: visible; flex: none">
          <defs>
            <clipPath id="l2-ct"><circle cx="60" cy="30" r="13"></circle></clipPath>
            <clipPath id="l2-cb"><circle cx="60" cy="90" r="13"></circle></clipPath>
            <mask id="l2-ma" maskUnits="userSpaceOnUse" x="-40" y="-40" width="200" height="200"><rect x="-40" y="-40" width="200" height="200" fill="#ffffff"></rect><circle cx="76" cy="60" r="34" fill="none" stroke="#000000" stroke-width="22" clip-path="url(#l2-ct)"></circle></mask>
            <mask id="l2-mb" maskUnits="userSpaceOnUse" x="-40" y="-40" width="200" height="200"><rect x="-40" y="-40" width="200" height="200" fill="#ffffff"></rect><circle cx="44" cy="60" r="34" fill="none" stroke="#000000" stroke-width="22" clip-path="url(#l2-cb)"></circle></mask>
          </defs>
          <g class="vb f5-spin">
            <g transform="rotate(-20 60 60)">
              <path d="M60 30 A34 34 0 0 1 60 90 A34 34 0 0 1 60 30 Z" fill="#6EE7B7"></path>
              <circle cx="44" cy="60" r="34" fill="none" stroke="#1A2B6D" stroke-width="12" mask="url(#l2-ma)"></circle>
              <circle cx="76" cy="60" r="34" fill="none" stroke="#0E9F6E" stroke-width="12" mask="url(#l2-mb)"></circle>
            </g>
          </g>
        </svg>
        <span style="font-size: 17px; color: #0B1640">Ovelto agent is thinking…</span>
      </div>
      <!-- Navy button in a busy state -->
      <div style="display: flex; align-items: center; gap: 10px; background: #0B1640; border-radius: 12px; padding: 12px 20px 12px 14px; align-self: flex-start">
        <svg width="24" height="24" viewBox="0 0 120 120" aria-hidden="true" style="overflow: visible; flex: none">
          <defs>
            <clipPath id="l3-ct"><circle cx="60" cy="30" r="13"></circle></clipPath>
            <clipPath id="l3-cb"><circle cx="60" cy="90" r="13"></circle></clipPath>
            <mask id="l3-ma" maskUnits="userSpaceOnUse" x="-40" y="-40" width="200" height="200"><rect x="-40" y="-40" width="200" height="200" fill="#ffffff"></rect><circle cx="76" cy="60" r="34" fill="none" stroke="#000000" stroke-width="22" clip-path="url(#l3-ct)"></circle></mask>
            <mask id="l3-mb" maskUnits="userSpaceOnUse" x="-40" y="-40" width="200" height="200"><rect x="-40" y="-40" width="200" height="200" fill="#ffffff"></rect><circle cx="44" cy="60" r="34" fill="none" stroke="#000000" stroke-width="22" clip-path="url(#l3-cb)"></circle></mask>
          </defs>
          <g class="vb f5-spin">
            <g transform="rotate(-20 60 60)">
              <path d="M60 30 A34 34 0 0 1 60 90 A34 34 0 0 1 60 30 Z" fill="#6EE7B7"></path>
              <circle cx="44" cy="60" r="34" fill="none" stroke="#9DB0F5" stroke-width="12" mask="url(#l3-ma)"></circle>
              <circle cx="76" cy="60" r="34" fill="none" stroke="#34D399" stroke-width="12" mask="url(#l3-mb)"></circle>
            </g>
          </g>
        </svg>
        <span style="font-size: 17px; font-weight: 600; color: #F3F6FA">Generating your prototype</span>
      </div>
      <div style="font-size: 15px; font-weight: 600; color: #1B2540">Thinking loader · kept for the website</div>
    </div>
  </div>

</div>
</x-dc>

</body>
</html>
