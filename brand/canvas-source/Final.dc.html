<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ovelto Labs — Final logo</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600&amp;family=JetBrains+Mono:wght@500&amp;display=swap">
<style>
body{margin:0}
a{color:#1A2B6D}a:hover{color:#0B1640}
</style>
</helmet>
<div style="width: 1840px; height: 1120px; box-sizing: border-box; padding: 24px; background: #EDF0F4; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); grid-template-rows: 420px 300px minmax(0, 1fr); gap: 16px; font-family: 'Space Grotesk', sans-serif; color: #0B1640">

  <!-- Primary lockup, light -->
  <div style="grid-column: span 2; background: #F3F6FA; border-radius: 16px; display: flex; align-items: center; justify-content: center; gap: 22px">
    <dc-import name="Mark" uid="fl1" size="132" tilt="-20" col-a="#1A2B6D" col-b="#0E9F6E" lens="#6EE7B7" hint-size="132px,132px"></dc-import>
    <div style="display: flex; align-items: baseline; font-size: 84px; letter-spacing: -0.035em; line-height: 1"><span style="font-weight: 600; color: #0B1640">ovelto</span><span style="font-weight: 400; color: #0E9F6E">.labs</span></div>
  </div>

  <!-- Primary lockup, deep navy -->
  <div style="grid-column: span 2; background: #0B1640; border-radius: 16px; display: flex; align-items: center; justify-content: center; gap: 22px">
    <dc-import name="Mark" uid="fl2" size="132" tilt="-20" col-a="#9DB0F5" col-b="#34D399" lens="#6EE7B7" hint-size="132px,132px"></dc-import>
    <div style="display: flex; align-items: baseline; font-size: 84px; letter-spacing: -0.035em; line-height: 1"><span style="font-weight: 600; color: #F3F6FA">ovelto</span><span style="font-weight: 400; color: #34D399">.labs</span></div>
  </div>

  <!-- Stacked lockup -->
  <div style="background: #F3F6FA; border-radius: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px">
    <dc-import name="Mark" uid="fl3" size="128" tilt="-20" col-a="#1A2B6D" col-b="#0E9F6E" lens="#6EE7B7" hint-size="128px,128px"></dc-import>
    <div style="display: flex; align-items: baseline; font-size: 44px; letter-spacing: -0.035em; line-height: 1"><span style="font-weight: 600">ovelto</span><span style="font-weight: 400; color: #0E9F6E">.labs</span></div>
  </div>

  <!-- Mark only, light -->
  <div style="background: #F3F6FA; border-radius: 16px; display: flex; align-items: center; justify-content: center">
    <dc-import name="Mark" uid="fl4" size="220" tilt="-20" col-a="#1A2B6D" col-b="#0E9F6E" lens="#6EE7B7" hint-size="220px,220px"></dc-import>
  </div>

  <!-- Mark only, navy -->
  <div style="background: #0B1640; border-radius: 16px; display: flex; align-items: center; justify-content: center">
    <dc-import name="Mark" uid="fl5" size="220" tilt="-20" col-a="#9DB0F5" col-b="#34D399" lens="#6EE7B7" hint-size="220px,220px"></dc-import>
  </div>

  <!-- App icons -->
  <div style="background: #F3F6FA; border-radius: 16px; display: flex; align-items: center; justify-content: center; gap: 24px">
    <div style="width: 132px; height: 132px; border-radius: 30px; background: #0B1640; display: flex; align-items: center; justify-content: center">
      <dc-import name="Mark" uid="fl6" size="104" tilt="-20" w-a="9" w-b="9" col-a="#9DB0F5" col-b="#34D399" lens="#6EE7B7" hint-size="104px,104px"></dc-import>
    </div>
    <div style="width: 132px; height: 132px; border-radius: 30px; background: #FFFFFF; box-shadow: inset 0 0 0 1px #D5DBE7; display: flex; align-items: center; justify-content: center">
      <dc-import name="Mark" uid="fl7" size="104" tilt="-20" w-a="9" w-b="9" col-a="#1A2B6D" col-b="#0E9F6E" lens="#6EE7B7" hint-size="104px,104px"></dc-import>
    </div>
  </div>

  <!-- One-colour navy (print, stamps, single-colour use) -->
  <div style="background: #F3F6FA; border-radius: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px">
    <div style="display: flex; align-items: center; gap: 12px">
      <dc-import name="Mark" uid="fl8" size="72" tilt="-20" col-a="#0B1640" col-b="#0B1640" lens="#C9D2EA" hint-size="72px,72px"></dc-import>
      <div style="display: flex; align-items: baseline; font-size: 40px; letter-spacing: -0.035em; line-height: 1"><span style="font-weight: 600">ovelto</span><span style="font-weight: 400">.labs</span></div>
    </div>
    <div style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #3F4966">One-colour · navy</div>
  </div>

  <!-- One-colour reversed -->
  <div style="background: #0B1640; border-radius: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px">
    <div style="display: flex; align-items: center; gap: 12px">
      <dc-import name="Mark" uid="fl9" size="72" tilt="-20" col-a="#F3F6FA" col-b="#F3F6FA" lens="#3B4A80" hint-size="72px,72px"></dc-import>
      <div style="display: flex; align-items: baseline; font-size: 40px; letter-spacing: -0.035em; line-height: 1; color: #F3F6FA"><span style="font-weight: 600">ovelto</span><span style="font-weight: 400">.labs</span></div>
    </div>
    <div style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #A3AED0">One-colour · reversed</div>
  </div>

  <!-- Favicon sizes: heavier strokes and a wider gap so the weave survives at 16px -->
  <div style="background: #F3F6FA; border-radius: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px">
    <div style="display: flex; align-items: flex-end; gap: 22px">
      <dc-import name="Mark" uid="fl10" size="64" tilt="-20" w-a="10" w-b="10" gap="4" col-a="#1A2B6D" col-b="#0E9F6E" lens="#6EE7B7" hint-size="64px,64px"></dc-import>
      <dc-import name="Mark" uid="fl11" size="32" tilt="-20" w-a="12" w-b="12" gap="5" col-a="#1A2B6D" col-b="#0E9F6E" lens="#6EE7B7" hint-size="32px,32px"></dc-import>
      <dc-import name="Mark" uid="fl12" size="16" tilt="-20" w-a="14" w-b="14" gap="6" col-a="#1A2B6D" col-b="#0E9F6E" lens="#6EE7B7" hint-size="16px,16px"></dc-import>
    </div>
    <div style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #3F4966">64 · 32 · 16 px (heavier strokes)</div>
  </div>

  <!-- Colour + type spec -->
  <div style="background: #FFFFFF; border-radius: 16px; box-shadow: inset 0 0 0 1px #D5DBE7; padding: 22px; box-sizing: border-box; display: flex; flex-direction: column; gap: 12px">
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
      <sc-for list="{{swatches}}" as="s" hint-placeholder-count="6">
        <div style="display: flex; flex-direction: column; gap: 4px">
          <div style="height: 30px; border-radius: 7px; background: {{s.hex}}; box-shadow: inset 0 0 0 1px rgba(11,22,64,0.12)"></div>
          <div style="font-size: 12px; font-weight: 600">{{s.name}}</div>
          <div style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #3F4966">{{s.hex}}</div>
        </div>
      </sc-for>
    </div>
    <div style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #3F4966; line-height: 1.5">Space Grotesk · “ovelto” 600 · “.labs” 400 · −3.5% tracking · mark tilted −20°</div>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1840,"height":1120}}'>
class Component extends DCLogic {
  renderVals() {
    // Final brand palette (Navy + Emerald). No black anywhere: darkest tone is Deep Navy.
    return {
      swatches: [
        { name: 'Navy (design ring)', hex: '#1A2B6D' },
        { name: 'Emerald (AI ring)', hex: '#0E9F6E' },
        { name: 'Mint (overlap)', hex: '#6EE7B7' },
        { name: 'Deep Navy (text/dark)', hex: '#0B1640' },
        { name: 'Periwinkle (on dark)', hex: '#9DB0F5' },
        { name: 'Mist (light ground)', hex: '#F3F6FA' }
      ]
    };
  }
}
</script>
</body>
</html>
